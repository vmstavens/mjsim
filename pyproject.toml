[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "mjsim"
version = "0.2.0"
description = "MuJoCo utilities for controllers, planners, deformable objects, and sensors."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Victor M. Staven" }]
dependencies = [
    "mink>=1.4.0",
    "mjviser>=0.0.16",
    "mujoco>=4.0.0,<5",
    "numpy>=2.4.6; python_version < '3.12'",
    "numpy>=2.5.4; python_version >= '3.12'",
    "ompl>=2.0.1",
    "open3d>=0.20.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pybind11-stubgen>=3.0.0",
    "robot-descriptions>=3.3.0",
    "scipy>=1.17.1; python_version < '3.12'",
    "scipy>=1.18.1; python_version >= '3.12'",
    "spatialmath-python>=1.1.19",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "mypy>=2.4.1", "ruff>=0.17.4", "pybind11-stubgen>=3.0.0"]
stubs = ["pybind11-stubgen>=3.0.0"]

[project.urls]
Homepage = "https://github.com/vmstavens/mjsim"
Repository = "https://github.com/vmstavens/mjsim"

[project.scripts]
mjsim-stubgen = "mjsim._stubgen:main"

[tool.uv.build-backend]
source-exclude = ["examples/**"]

[tool.ty.environment]
python = "./.venv"
extra-paths = ["./typings"]
